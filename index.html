  .topbar h1{font-size:17px;font-weight:800;letter-spacing:.5px}
  .topbar .sub{font-size:12px;color:#888;font-weight:500}
  .wrap{display:flex;gap:24px;padding:24px 28px;max-width:1400px;margin:0 auto;align-items:flex-start;flex-wrap:wrap}
  .panel{background:#fff;border-radius:16px;padding:22px;box-shadow:0 2px 16px rgba(0,0,0,.05)}
  .controls{width:330px;flex:0 0 330px}
  .stage{flex:1;min-width:420px;display:flex;flex-direction:column;gap:14px}
  .group{margin-bottom:20px}
  .group h3{font-size:13px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .group h3::before{content:"";width:4px;height:14px;background:var(--red);border-radius:2px}
  .upload{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;gap:3px;border:2px dashed var(--red);border-radius:12px;padding:20px 16px;text-align:center;cursor:pointer;transition:.15s;background:#fff5f6}
  .upload:active{background:#ffe9ec;border-color:#c81232}
  .upload .plus{width:42px;height:42px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;margin-bottom:6px;flex:none}
  .upload .plus svg{width:22px;height:22px;display:block}
  .upload.small{padding:13px 12px}
  .upload.small .plus{width:30px;height:30px;margin-bottom:3px}
  .upload.small .plus svg{width:16px;height:16px}
  .upload p{font-size:12px;color:#888;line-height:1.7}
  .upload .big{font-size:14px;font-weight:700;color:var(--red)}
  .upload input{display:none}
  .row{display:flex;gap:10px;margin-bottom:10px}
  .field{flex:1}
  .field label{display:block;font-size:11px;color:#999;margin-bottom:5px;font-weight:600}
  .field input{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:9px;font-size:13px;font-family:inherit;outline:none}
  .field input:focus{border-color:var(--red)}
  .slider-row{display:flex;align-items:center;gap:10px;font-size:12px;color:#666;margin-top:4px}
  .slider-row input[type=range]{flex:1;accent-color:var(--red)}
  .smallbtn{padding:7px 12px;font-size:12px;border:1px solid #ddd;border-radius:8px;background:#fff;cursor:pointer;font-family:inherit}
  .smallbtn:hover{border-color:var(--red);color:var(--red)}
  .btn{display:block;width:100%;padding:13px;border:0;border-radius:11px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;margin-bottom:10px}
  .btn.red{background:var(--red);color:#fff}
  .btn.ghost{background:#fff;color:var(--red);border:1.5px solid var(--red)}
  .btn:active{transform:scale(.99)}
  .hint{font-size:11px;color:#999;line-height:1.7;background:#fafafa;border-radius:9px;padding:10px 12px}
  .checkline{display:flex;align-items:center;gap:7px;font-size:12px;color:#666;margin-top:8px}
  .checkline input{accent-color:var(--red)}
  .canvas-box{width:100%;border-radius:14px;background:#fff;border:1px solid var(--line);padding:14px;display:flex;justify-content:center;overflow:auto}
  canvas#card{width:100%;max-width:860px;height:auto;border-radius:10px;cursor:grab;display:block;touch-action:none}
  canvas#card.dragging{cursor:grabbing}
  .note{font-size:11px;color:#aaa;text-align:center}
  .tag{display:inline-block;font-size:10px;background:var(--red);color:#fff;padding:2px 7px;border-radius:20px;margin-left:6px;vertical-align:middle}
  .save-tip{display:flex;align-items:center;gap:8px;justify-content:center;font-size:11px;color:var(--red);font-weight:700;background:#fff5f6;border:1px solid #ffd5dc;border-radius:9px;padding:9px 10px;margin:0 0 10px;line-height:1.5}
  .save-tip svg{width:15px;height:15px;flex:none}
  .mask{position:fixed;inset:0;background:rgba(10,10,10,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;padding:18px 14px;overflow:auto}
  .mask.show{display:flex}
  .mask .tip{background:var(--red);color:#fff;font-weight:800;font-size:15px;padding:11px 22px;border-radius:999px;margin-bottom:14px;box-shadow:0 4px 18px rgba(0,0,0,.4);text-align:center}
  .mask .close{position:fixed;top:14px;right:14px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;border:0;font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:inherit}
  .mask img{max-width:100%;max-height:70vh;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.5);-webkit-touch-callout:default}
  .mask .sub{color:rgba(255,255,255,.82);font-size:12px;margin-top:14px;line-height:1.8;text-align:center}
  @media (max-width:860px){
    .topbar{padding:10px 14px;gap:6px}
    .topbar h1{font-size:15px}
    .topbar .sub{display:none}
    .wrap{flex-direction:column;align-items:stretch;flex-wrap:nowrap;padding:12px;gap:12px}
    .stage{order:1;position:sticky;top:0;z-index:30;width:100%;min-width:0;flex:none;padding:12px;gap:10px;border-radius:12px;box-shadow:0 4px 18px rgba(0,0,0,.08)}
    .controls{order:2;width:100%;flex:0 0 auto;padding:16px}
    .canvas-box{padding:0;border:0;border-radius:0}
    canvas#card{width:100%;max-width:none;border-radius:8px}
    .stage .note{display:none}
  }
</style>
</head>
<body>
<div class="topbar">
  <div class="logo"></div>
  <h1>PLAYER ID CARD 追风证一键生成器</h1>
  <span class="sub">TMALL COLLEGE GAMES · 9cm×6cm · 本地运行，照片不上传</span>
</div>

<div class="wrap">
  <div class="panel controls">
    <div class="group">
      <h3>① 上传大头照</h3>
      <label class="upload" for="filePhoto">
        <span class="plus"><svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></span>
        <p class="big">点击上传照片</p>
        <p>建议正面清晰大头照<br>上传后在上方预览卡片上拖动对位，双指或滑块缩放</p>
        <input id="filePhoto" type="file" accept="image/*">
      </label>
      <div class="slider-row">
        <span>缩放</span>
        <input type="range" id="zoom" min="1" max="3" step="0.01" value="1">
        <button class="smallbtn" onclick="resetPhoto()">重置</button>
      </div>
    </div>

    <div class="group">
      <h3>② 填写信息</h3>
      <div class="field" style="margin-bottom:10px">
        <label>队员姓名 / NAME</label>
        <input id="inName" maxlength="6" placeholder="王文杰" value="王文杰">
      </div>
      <div class="field" style="margin-bottom:10px">
        <label>所属高校 / COLLEGE</label>
        <input id="inCollege" maxlength="10" placeholder="清华大学" value="清华大学">
      </div>
      <div class="field">
        <label>出战小队 / TEAM NAME</label>
        <input id="inTeam" maxlength="16" placeholder="清华大学xxxxx跑团" value="清华大学xxxxx跑团">
      </div>
    </div>

    <div class="group">
      <h3>③ 校徽（可选）</h3>
      <label class="upload small" for="fileBadge">
        <span class="plus"><svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></span>
        <p class="big">上传自定义校徽</p>
        <p>不上传则使用默认样例</p>
        <input id="fileBadge" type="file" accept="image/*">
      </label>
      <label class="checkline"><input type="checkbox" id="hideBadge"> 不显示校徽</label>
    </div>

    <div class="group" style="margin-bottom:8px">
      <button class="btn red" onclick="download()">下载追风证 PNG（高清）</button>
    <div class="save-tip"><svg viewBox="0 0 24 24" fill="none"><path d="M12 4v12m0 0l-4-4m4 4l4-4M5 20h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>手机端：点下载后长按图片，选「保存到相册」</div>
    </div>
    <div class="hint">
      导出尺寸 2126×1417px（约 9×6cm @600dpi 印刷精度）。所有操作均在本机浏览器完成，照片不会上传到任何服务器。
    </div>
  </div>

  <div class="panel stage">

    <div class="canvas-box">
      <canvas id="card" width="2126" height="1417"></canvas>
    </div>
    <div class="note">提示：在照片区域按住拖动调整位置，手机可双指缩放，电脑用滚轮缩放（仅正面可操作）</div>
  </div>
</div>

<div class="mask" id="saveMask">
  <button class="close" id="saveClose" aria-label="关闭">&#215;</button>
  <div class="tip">长按图片，选择「保存到相册」</div>
  <img id="saveImg" alt="追风证">
  <div class="sub">如未自动保存，请在图片上长按保存<br>保存后点右上角 &times; 返回</div>
</div>

const imgs = {};
function loadAll(){
  const jobs = Object.entries(ASSETS).map(([k,v])=>new Promise(res=>{
    const im=new Image(); im.onload=()=>{imgs[k]=im;res()}; im.onerror=()=>res(); im.src=v;
  }));
  return Promise.all(jobs);
}

/* ============ 状态 ============ */
const BASE_W=1082, BASE_H=736, K=2126/1082;
const state = {
  side:'front',
  photo:null, photoScale:1, photoX:0, photoY:0,
  badge:null, hideBadge:false
};
const canvas=document.getElementById('card');
const ctx=canvas.getContext('2d');

/* ============ 基础几何 ============ */
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function imgCover(im, box, scale, ox, oy){
  const s=Math.max(box.w/im.width, box.h/im.height)*scale;
  const w=im.width*s, h=im.height*s;
  const maxOx=Math.max(0,(w-box.w)/2), maxOy=Math.max(0,(h-box.h)/2);
  ox=Math.max(-maxOx,Math.min(maxOx,ox));
  oy=Math.max(-maxOy,Math.min(maxOy,oy));
  ctx.drawImage(im, box.x+box.w/2-w/2+ox, box.y+box.h/2-h/2+oy, w, h);
  state.photoX=ox; state.photoY=oy;
}
function bracket(x,y,dx,dy){
  ctx.beginPath();
  ctx.moveTo(x+dx,y); ctx.lineTo(x,y); ctx.lineTo(x,y+dy);
  ctx.stroke();
}

  // 卡身右侧极淡灰边（模拟纸张）
  ctx.fillStyle='#fff'; rr(0,0,BASE_W,BASE_H,26); ctx.fill();
  ctx.fillStyle='#E8163B';
  ctx.fillRect(0,0,BASE_W,108);
  ctx.fillRect(0,648,BASE_W,88);

  /* 头部 */
  ctx.fillStyle='#fff';
  ctx.textBaseline='alphabetic';
  // 超粗压缩体（对齐 PSD 字形）
  ctx.save();
  ctx.translate(88,0); ctx.scale(0.75,1);
  ctx.font='900 80px "Arial Black",Impact,"Arial",sans-serif';
  ctx.fillText('PLAYER ID CARD', 0, 82);
  ctx.restore();
  ctx.drawImage(imgs.headerCombo, 694, 32, 220, 52);
  ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(933,30); ctx.lineTo(933,87); ctx.stroke();
  ctx.drawImage(imgs.adidas, 953, 32, 83, 52);

  /* 照片 */
  ctx.save();
  ctx.beginPath(); ctx.rect(PHOTO.x,PHOTO.y,PHOTO.w,PHOTO.h); ctx.clip();
  const photo = state.photo || imgs.portrait;
  if(photo) imgCover(photo, PHOTO, state.photoScale, state.photoX, state.photoY);
  else { ctx.fillStyle='#eee'; ctx.fillRect(PHOTO.x,PHOTO.y,PHOTO.w,PHOTO.h); }
  ctx.restore();
  // 四角定位线
  ctx.strokeStyle='#111'; ctx.lineWidth=6; ctx.lineCap='square';
  const L=22;
  bracket(PHOTO.x-2,PHOTO.y-2,L,0); bracket(PHOTO.x-2,PHOTO.y-2,0,L);
  bracket(PHOTO.x+PHOTO.w+2,PHOTO.y-2,-L,0); bracket(PHOTO.x+PHOTO.w+2,PHOTO.y-2,0,L);
  bracket(PHOTO.x-2,PHOTO.y+PHOTO.h+2,L,0); bracket(PHOTO.x-2,PHOTO.y+PHOTO.h+2,0,-L);
  bracket(PHOTO.x+PHOTO.w+2,PHOTO.y+PHOTO.h+2,-L,0); bracket(PHOTO.x+PHOTO.w+2,PHOTO.y+PHOTO.h+2,0,-L);

  /* 信息栏 */
  ctx.fillStyle='#9a9a9a';
  ctx.font='700 23px "PingFang SC","Heiti SC",sans-serif';
  ctx.fillText('队员姓名 / NAME', 462, 190);
  ctx.fillText('所属高校 / COLLEGE', 688, 190);
  ctx.fillText('出战小队 / TEAM NAME', 462, 342);

  const name=document.getElementById('inName').value || ' ';
  const college=document.getElementById('inCollege').value || ' ';
  const team=document.getElementById('inTeam').value || ' ';
  ctx.fillStyle='#111';
  ctx.font='800 42px "PingFang SC","Heiti SC",sans-serif';
  ctx.fillText(name, 462, 252);
  ctx.fillText(college, 688, 252);
  ctx.fillText(team, 462, 402);

  // 分隔线
  ctx.strokeStyle='#d9d9d9'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(462,286); ctx.lineTo(1055,286); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(462,448); ctx.lineTo(760,448); ctx.stroke();

  /* 校徽 */
  if(!state.hideBadge){
    const b = state.badge || imgs.badge;
    if(b) ctx.drawImage(b, 952, 148, 114, 114);
  }
  /* 跑步线稿 */
  if(imgs.runner) ctx.globalAlpha=0.9, ctx.drawImage(imgs.runner, 792, 282, 225, 227), ctx.globalAlpha=1;
  /* TMALL 手写体 */
  ctx.drawImage(imgs.tmall, 455, 472, 262, 125);
  /* slogan */
  ctx.fillStyle='#111';
  ctx.font='900 50px "PingFang SC","Heiti SC",sans-serif';
  ctx.fillText('接下来 去飞', 730, 555);

  /* 脚部红条 */
  ctx.drawImage(imgs.logo1goWhite, 100, 668, 131, 50);
  ctx.drawImage(imgs.logoTcgWhite, 238, 679, 323, 30);
  ctx.drawImage(imgs.logo1goWhite, 605, 668, 131, 50);
  ctx.drawImage(imgs.logoTcgWhite, 740, 679, 323, 30);
}

/* ============ 背面 ============ */
function drawBack(){
  ctx.setTransform(K,0,0,K,0,0);
  ctx.clearRect(0,0,BASE_W,BASE_H);
  ctx.fillStyle='#fff'; rr(0,0,BASE_W,BASE_H,26); ctx.fill();
  ctx.drawImage(imgs.logo1goRed, 261, 235, 560, 214);
  ctx.drawImage(imgs.logoTcgRed, 241, 600, 600, 36);
}

function render(){ drawFront(); }

/* ============ 交互 ============ */
['inName','inCollege','inTeam'].forEach(id=>{
  document.getElementById(id).addEventListener('input',render);
});
document.getElementById('hideBadge').addEventListener('change',e=>{
  state.hideBadge=e.target.checked; render();
});
document.getElementById('zoom').addEventListener('input',e=>{
  state.photoScale=parseFloat(e.target.value); render();
});
function resetPhoto(){
  state.photoScale=1; state.photoX=0; state.photoY=0;
  document.getElementById('zoom').value=1; render();
}
function readFile(input, cb){
  const f=input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>cb(im);im.src=r.result;};
  r.readAsDataURL(f);
}
document.getElementById('filePhoto').addEventListener('change',e=>{
  readFile(e.target, im=>{state.photo=im;resetPhoto();});
});
document.getElementById('fileBadge').addEventListener('change',e=>{
  readFile(e.target, im=>{state.badge=im;state.hideBadge=false;
    document.getElementById('hideBadge').checked=false;render();});
});

/* 照片拖动 / 滚轮缩放（坐标换算） */
function canvasPos(e){
  const r=canvas.getBoundingClientRect();
  return {x:(e.clientX-r.left)/r.width*BASE_W, y:(e.clientY-r.top)/r.height*BASE_H};
}
const pts=new Map();
let drag=null, pinch=null;
function inPhoto(p){return p.x>=PHOTO.x&&p.x<=PHOTO.x+PHOTO.w&&p.y>=PHOTO.y&&p.y<=PHOTO.y+PHOTO.h;}
function photoGeom(){
  const im=state.photo||imgs.portrait;
  const s0=Math.max(PHOTO.w/im.width,PHOTO.h/im.height);
  return {w:im.width*s0*state.photoScale,h:im.height*s0*state.photoScale};
}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
function mid(a,b){return {x:(a.x+b.x)/2,y:(a.y+b.y)/2};}
canvas.addEventListener('pointerdown',e=>{
  canvas.setPointerCapture(e.pointerId);
  pts.set(e.pointerId,canvasPos(e));
  if(pts.size===1){
    const p=pts.get(e.pointerId);
    if(inPhoto(p)){drag={x:p.x,y:p.y,ox:state.photoX,oy:state.photoY};canvas.classList.add('dragging');}
  }else if(pts.size===2){
    drag=null;
    const a=[...pts.values()], m=mid(a[0],a[1]), g=photoGeom();
    pinch={d:dist(a[0],a[1]),s:state.photoScale,
      ux:(m.x-(PHOTO.x+PHOTO.w/2)+g.w/2-state.photoX)/g.w,
      uy:(m.y-(PHOTO.y+PHOTO.h/2)+g.h/2-state.photoY)/g.h};
  }
});
canvas.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId)) return;
  pts.set(e.pointerId,canvasPos(e));
  if(pinch&&pts.size>=2){
    const a=[...pts.values()], m=mid(a[0],a[1]), d=dist(a[0],a[1]);
    const ns=Math.max(1,Math.min(3,pinch.s*d/pinch.d));
    const g=photoGeom(), ratio=ns/state.photoScale, w=g.w*ratio, h=g.h*ratio;
    state.photoScale=ns;
    state.photoX=m.x-(PHOTO.x+PHOTO.w/2)+w/2-pinch.ux*w;
    state.photoY=m.y-(PHOTO.y+PHOTO.h/2)+h/2-pinch.uy*h;
    document.getElementById('zoom').value=ns;
    render();
  }else if(drag){
    const p=pts.get(e.pointerId);
    state.photoX=drag.ox+(p.x-drag.x);
    state.photoY=drag.oy+(p.y-drag.y);
    render();
  }
});
function endPointer(e){
  pts.delete(e.pointerId);
  if(pts.size<2) pinch=null;
  if(pts.size===1){
    const [id]=[...pts.keys()], p=pts.get(id);
    if(inPhoto(p)) drag={x:p.x,y:p.y,ox:state.photoX,oy:state.photoY};
  }
  if(pts.size===0){drag=null;canvas.classList.remove('dragging');}
}
canvas.addEventListener('pointerup',endPointer);
canvas.addEventListener('pointercancel',endPointer);
canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  const z=document.getElementById('zoom');
  z.value=Math.max(1,Math.min(3,parseFloat(z.value)+(e.deltaY<0?0.06:-0.06)));
  state.photoScale=parseFloat(z.value); render();
},{passive:false});

/* ============ 下载 ============ */
const isIOS=/iPhone|iPad|iPod/.test(navigator.userAgent);
const isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
function showSaveMask(url){
  const mask=document.getElementById('saveMask');
  document.getElementById('saveImg').src=url;
  mask.classList.add('show');
}
document.getElementById('saveClose').addEventListener('click',()=>{
  document.getElementById('saveMask').classList.remove('show');
  document.getElementById('saveImg').src='';
});
function download(){
  render();
  const name=document.getElementById('inName').value.trim()||'追风队员';
  const url=canvas.toDataURL('image/png');
  if(isIOS){
    showSaveMask(url);
  }else{
    const a=document.createElement('a');
    a.download=`PLAYER-ID-CARD-${name}.png`;
    a.href=url;
    document.body.appendChild(a); a.click(); a.remove();
    if(isTouch) setTimeout(()=>showSaveMask(url),300);
  }
}

loadAll().then(()=>{
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(render);
  render();
});
